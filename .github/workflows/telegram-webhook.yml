name: Telegram webhook menü isteği
on:
  workflow_dispatch:
    inputs:
      command:
        description: Menü komutu
        required: true
        type: choice
        options: [bugun, yarin, hafta]
      requested_at:
        description: Telegram mesajının Unix zamanı
        required: true
        type: string
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: İstenen menüyü Telegram üzerinden gönder
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MENU_COMMAND: ${{ inputs.command }}
          REQUESTED_AT: ${{ inputs.requested_at }}
        run: python telegram_webhook.py
