name: Günlük yemek menüsü

on:
  schedule:
    - cron: "30 10 * * *"
      timezone: "Europe/Istanbul" # Her gün 10:30 Türkiye saati
  workflow_dispatch:
    inputs:
      panel_only:
        description: "Panelde göster; bildirim gönderme ve karşılaştırma listesini değiştirme"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: maltepe-yemek-mail-writes
  cancel-in-progress: false

jobs:
  menu-gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PANEL_ONLY: ${{ inputs.panel_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Menüyü çek ve gönder
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python yemek_mail.py
      - name: Yeni aylık listeyi depoya kaydet
        run: |
          if [[ -n "$(git status --porcelain -- menu-arsivi/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add menu-arsivi/
            git commit -m "Aylık yemek listesini kaydet"
            git push
          else
            echo "Kaydedilecek yeni aylık liste yok."
          fi

      - name: Panel sonucunu sakla
        if: always() && hashFiles('panel-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: panel-result
          path: panel-result.json
          retention-days: 30
          if-no-files-found: error
